name: build-and-test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAESBRIDGE_BUILD_MANAGER=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Build SwiftUI manager
        run: /bin/zsh scripts/build-manager.sh "$PWD/build/aes-bridge-engine"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ControlApp/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri control dependencies
        working-directory: ControlApp
        run: npm ci
      - name: Prepare Tauri engine sidecar
        working-directory: ControlApp
        run: /bin/sh ./scripts/prepare-macos-sidecar.sh
      - name: Test Tauri control backend
        working-directory: ControlApp
        run: cargo test --manifest-path src-tauri/Cargo.toml --target-dir "$RUNNER_TEMP/aes-bridge-tauri-target"
      - name: Build autonomous Tauri control app
        working-directory: ControlApp
        run: AES_BRIDGE_TAURI_TARGET_DIR="$RUNNER_TEMP/aes-bridge-tauri-target" npm run bundle:mac:dev
      - name: Validate installer artifacts
        run: /bin/zsh Installer/preflight.sh "$PWD/build" "/private/tmp/aes-bridge-dist/AES Bridge.app" --no-runtime
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package macOS development build
        run: /bin/zsh scripts/package-macos.sh "$PWD/build" "/private/tmp/aes-bridge-dist/AES Bridge.app" "$PWD/artifacts"
      - name: Upload macOS development build
        uses: actions/upload-artifact@v4
        with:
          name: AES-Bridge-macOS-development
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Tauri control app
        uses: actions/upload-artifact@v4
        with:
          name: AES-Bridge-Control-macOS-development
          path: ${{ runner.temp }}/aes-bridge-tauri-target/debug/bundle/macos/AES Bridge.app
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DAESBRIDGE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows backend
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir "$PWD/build/Release" -OutputDir "$PWD/artifacts"
      - name: Upload Windows backend
        uses: actions/upload-artifact@v4
        with:
          name: AES-Bridge-Windows-backend-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
