name: build-and-test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAESBRIDGE_BUILD_MANAGER=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Build SwiftUI manager
        run: /bin/zsh scripts/build-manager.sh "$PWD/build/aes-bridge-engine"
      - name: Validate installer artifacts
        run: /bin/zsh Installer/preflight.sh "$PWD/build" "/private/tmp/aes-bridge-dist/AES Bridge.app" --no-runtime
      - name: Test
        run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DAESBRIDGE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
